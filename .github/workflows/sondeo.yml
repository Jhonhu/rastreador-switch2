name: Sondeo de tiendas (diagnóstico manual)

# Responde "¿las tiendas bloquean las IPs de GitHub Actions?". Solo imprime en el
# log status, tamaño y marcadores por URL; no guarda HTML ni usa secretos.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sondear:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install -r requirements.txt
      - run: python investigacion/sondeo.py
