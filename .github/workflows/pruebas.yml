name: Pruebas

on:
  push:
    paths-ignore: ["data/**", "docs/datos.json"]  # los commits de datos del bot no necesitan pruebas
  pull_request: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # las pruebas no hacen push: el token no se queda en .git/config

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Pruebas
        run: python -m pytest
