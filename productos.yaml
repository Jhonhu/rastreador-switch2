# Productos a rastrear. Importes en PESOS (el código los convierte a centavos).
# Tiendas soportadas: liverpool, walmart, gameplanet, sears (ver investigacion/HALLAZGOS.md).
# Claves desconocidas = error: un typo como "valor_extar" no pasa en silencio.

ajustes:
  lecturas_minimas: 3        # lecturas OK previas antes de alertar "nuevo mínimo histórico"
  precio_min_valido: 5000    # fuera de este rango la lectura es error: evita tomar
  precio_max_valido: 25000   #   la mensualidad MSI (~$1,000) como si fuera el precio
  precio_objetivo: 9500      # alerta cuando el precio efectivo cruce hacia abajo
  baja_minima_alerta: 200    # un "nuevo mínimo" solo avisa si baja al menos esto

productos:
  - id: liverpool-estandar
    tienda: liverpool
    version: nacional
    descripcion: Switch 2 256 GB edición estándar
    url: https://www.liverpool.com.mx/tienda/pdp/consola-nintendo-switch-2-de-256-gb-edicion-estandar/1177646322

  - id: liverpool-bundle-pokemon
    tienda: liverpool
    version: nacional
    descripcion: Switch 2 256 GB + Pokémon Legends Z-A (descarga digital)
    url: https://www.liverpool.com.mx/tienda/pdp/consola-nintendo-switch-2-de-256-gb-edici%C3%B3n-bundle-pok%C3%A9mon/1186172911
    valor_extra: 1500          # lo que vale para ti el juego incluido

  - id: liverpool-bundle-sports
    tienda: liverpool
    version: nacional
    descripcion: Switch 2 256 GB edición Bundle Sports Resort
    url: https://www.liverpool.com.mx/tienda/pdp/consola-fija-portatil-switch-2-de-256-gb-edicion-bundle-sports-resort/1209428225
    valor_extra: 1500

  - id: walmart-estandar
    tienda: walmart
    version: nacional          # EAN 045496885816, el mismo que Sears
    descripcion: Switch 2 256 GB (vendido por Walmart)
    url: https://www.walmart.com.mx/ip/consola-nintendo-switch-2-256-gb/00004549688581

  - id: gameplanet-estandar
    tienda: gameplanet
    version: sin_declarar      # Gameplanet no dice si es nacional o importada
    descripcion: Switch 2 con adaptador de corriente
    url: https://gameplanet.com/producto/consola-nintendo-switch-2-con-adaptador-nsw2/

  - id: gameplanet-mario-kart
    tienda: gameplanet
    version: sin_declarar
    descripcion: Switch 2 + Mario Kart World (físico) + adaptador
    url: https://gameplanet.com/producto/consola-nintendo-switch-2-con-mario-kart-world-fisico-y-adaptador-de-corriente-nsw2/
    valor_extra: 1800

  - id: sears-estandar
    tienda: sears
    version: nacional          # EAN 045496885816
    descripcion: Switch 2 256 GB (vendido por Sears)
    url: https://www.sears.com.mx/producto/3522519/consola-nintendo-switch-2

  - id: sears-mario-kart
    tienda: sears
    version: nacional
    descripcion: Switch 2 + Mario Kart World (vendido por Sears)
    url: https://www.sears.com.mx/producto/3522625/consola-nintendo-switch-2-mario-kart-world
    valor_extra: 1800

# Búsquedas fijas para enterarse de productos NUEVOS: avisa UNA vez por SKU
# (los ya avisados quedan en data/vigilancias.json). Solo tiendas con buscador investigado.
vigilancias:
  - id: liverpool-bundle-pokemon
    tienda: liverpool
    busqueda: consola nintendo switch 2
    # Liverpool tituló el bundle "Consola ... switch de 256 gb Nintendo pokémon" (sin "2"):
    # "256" separa la Switch 2 de las Switch 1 (máx. 64 GB). Sin acentos ni mayúsculas.
    requiere: [consola, pokemon, "256"]
